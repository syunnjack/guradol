name: Fetch gravure

# グラビアの作品データを取り直す。
#
# 発売月ごとに区切って作品側からなめる。作品に出演者が入っているので、
# 1回のなめで全員ぶんが揃う。途中で止まっても data/gravure-state.json の
# 「次に取る月」から続きを取る。

on:
  workflow_dispatch:
    inputs:
      from_month:
        description: '取り始める月（YYYY-MM。空なら前回の続き）'
        type: string
        required: false
      max_minutes:
        description: '何分で打ち切るか'
        type: string
        default: '300'
      reset:
        description: '前回の結果を捨てて最初から取り直す'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: グラビアの作品を取る
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          FROM_MONTH: ${{ inputs.from_month }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          RESET: ${{ inputs.reset && '1' || '' }}
        run: python scripts/fetch-gravure.py

      - name: 取れた量を見る
        run: |
          ls -la data/
          python - <<'PY'
          import json, pathlib
          for name, key in (('gravure-actor-works', 'actors'), ('gravure-makers', 'makers')):
              path = pathlib.Path('data') / f'{name}.json'
              if not path.exists():
                  print(f'{name}: まだ無い')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'{name}: {len(data[key]):,} 件 / 見た作品 {data.get("scanned", 0):,}')
          PY

      - name: 変化があれば commit する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "データに変化はありませんでした。"
            exit 0
          fi
          git commit -m "グラビアの作品データを取り直す"
          git pull --rebase --autostash origin main
          git push
