name: Fetch Yahoo used

# 出演者ごとに、Yahoo!ショッピングの**中古**を集める。
#
# 新品は DMM と楽天で足りている。Yahoo は `condition` が項目として
# 返るので、中古かどうかを推測せずに決められる。
#
# 出演者の名簿を使うので、fetch-gravure より後に走らせる。
# 1人1回・9,000人ぶんあるので、300分では終わらない前提。続きから取れる。

on:
  schedule:
    - cron: '0 21 1 * *'   # 毎月1日 06:00 JST（楽天 05:00 のあと）
  workflow_dispatch:
    inputs:
      only:
        description: '何人だけ試すか（0 なら全部）'
        type: string
        default: '0'
      minutes:
        description: '何分で切り上げるか'
        type: string
        default: '300'
      reset:
        description: '前回の結果を捨てて最初から'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Yahoo!ショッピングの中古を集める
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ONLY: ${{ inputs.only || '0' }}
          MAX_MINUTES: ${{ inputs.minutes || '300' }}
          RESET: ${{ inputs.reset && '1' || '' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/fetch-yahoo.py

      - name: 変化があれば commit する
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/yahoo-works.json data/yahoo-state.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変化はありませんでした。"
            exit 0
          fi

          people=$(python -c "import io,json;print(len(json.load(io.open('data/yahoo-works.json',encoding='utf-8'))['actors']))")
          git commit -m "Yahoo!ショッピングの中古を取り直す（${people}人ぶん）"
          # ほかの取得と同時に走ることがある。競合したら待って引き直す。
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true
              break
            fi
            echo "push が競合しました（${attempt}回目）。待って試します。"
            sleep $((15 * attempt))
          done
          if [ "$pushed" != true ]; then
            echo "push できませんでした。取れたデータは残っていません。" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # bot の push では deploy が起動しないため、ここから明示的に呼ぶ。
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
