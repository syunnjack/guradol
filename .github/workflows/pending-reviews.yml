name: Check pending reviews

# 未承認の口コミがあれば Issue を立てる。
#
# 実在の人物についての書き込みなので、公開前に必ず運営が読む決まりにしている。
# ところが「読むべきものが来ている」ことに気づく手立てが無かった。
# Issue が立てば GitHub からメールが届くので、そこで気づける。
#
# 同じ内容の Issue を毎日作らないよう、開いたままのものがあれば作らない。
# **ただし黙るわけではない。** 前に知らせたときと顔ぶれが変わっていれば、
# その Issue にコメントを足す。
#
# darekore.jp 側では、Issue を16日間閉じ忘れている間、新しい口コミが
# 来ても通知が出ない作りになっていた。同じ穴をこちらにも開けない。

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 未承認の口コミを調べる
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python scripts/check-pending-reviews.py > body.md
          if [ -s body.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 開いたままの Issue があるか見る
        if: steps.check.outputs.found == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "口コミの確認" --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Issue を立てる
        if: steps.check.outputs.found == 'true' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "口コミの確認" --repo "$GITHUB_REPOSITORY" \
            --color "B60205" --description "公開前の確認待ち" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "未承認の口コミがあります" \
            --label "口コミの確認" \
            --body-file body.md

      # 開いたままの Issue があるときは、**顔ぶれが変わったときだけ**足す。
      # 変わっていなければ黙る。毎朝コメントが増えると読まなくなるため。
      - name: 開いている Issue に足す
        if: steps.check.outputs.found == 'true' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          mark=$(grep -o '<!-- pending: [^>]*-->' body.md | tail -1)

          if [ -z "$mark" ]; then
            echo "印が無いので足さない"
            exit 0
          fi

          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json body,comments --jq '.body, (.comments[].body)' > seen.txt

          if grep -qF "$mark" seen.txt; then
            echo "#$NUMBER で知らせた顔ぶれと同じなので足さない"
          else
            echo "顔ぶれが変わったので #$NUMBER に足す"
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi
